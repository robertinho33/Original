<!doctype html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AURÉA — Administração</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>

<body>

<main class="admin-login">

    <section class="admin-login-card">

        <div class="admin-login-brand">
            AURÉA
            <span>COSMETICS</span>
        </div>

        <h1>Administração</h1>

        <p>
            Acesse o ambiente operacional
            da AURÉA Cosmetics.
        </p>

        <form id="adminLoginForm">

            <label for="adminToken">
                Token administrativo
            </label>

            <input
                id="adminToken"
                type="password"
                autocomplete="off"
                required
            >

            <button
                id="adminLoginButton"
                type="submit"
            >
                Entrar
            </button>

            <div
                id="adminLoginError"
                class="admin-login-error"
                hidden
            ></div>

        </form>

    </section>
    <form id="adminLoginForm">

    <label for="adminEmail">E-mail</label>
    <input
        id="adminEmail"
        type="email"
        value="robertinho33@gmail.com"
        autocomplete="username"
        required
    >

    <label for="adminPassword">Senha</label>
    <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        required
    >

    <button
        id="adminLoginButton"
        type="submit"
    >
        Entrar
    </button>

    <div
        id="adminLoginError"
        class="admin-login-error"
        hidden
    ></div>

</form>

</main>

<script type="module" src="../js/admin/admin-login.js"></script>

</body>
</html>
