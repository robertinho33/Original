<!doctype html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fios Perfeitos — Administração</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

<link rel="icon" type="image/svg+xml" href="/assets/brands/fp.svg?v=20261029"><link rel="alternate icon" href="/favicon.ico?v=20261029"></head>

<body>

<main class="admin-login">

   <section class="admin-login-card">

    <div class="admin-login-brand">
        Fios Perfeitos <span>COSMETICS</span>
    </div>

    <h1>Administração</h1>

    <p>Acesse o ambiente operacional da Fios Perfeitos Cosmetics.</p>

    <form id="adminLoginForm" autocomplete="off">

    <label for="adminEmail">E-mail</label>
    <input
        id="adminEmail"
        type="email"
        autocomplete="off"
        required
    >

    <label for="adminPassword">Senha</label>
    <input
        id="adminPassword"
        type="password"
        autocomplete="off"
        required
    >

    <button id="adminLoginButton" type="submit">
        Entrar
    </button>

    <div id="adminLoginError" class="admin-login-error" hidden></div>

</form>

</section>

</main>

<script type="module" src="../js/admin/admin-login.js"></script>

<script src="../js/utils/form-masks.js"></script>
</body>
</html>
