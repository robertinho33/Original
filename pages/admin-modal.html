<div<div
    id="adminModal"
    class="admin-modal"
    aria-hidden="true"
>
    <div
        class="admin-modal-backdrop"
        data-admin-modal-close
        tabindex="-1"
    ></div>

    <div
        class="admin-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="adminModalTitle"
    >
        <header class="admin-modal-header">
            <h2 id="adminModalTitle">Administração</h2>
            <button
                type="button"
                class="admin-modal-close"
                data-admin-modal-close
                aria-label="Fechar modal"
            >
                &times;
            </button>
        </header>

        <div
            id="adminModalContent"
            class="admin-modal-content"
        ></div>

    </div>
</div>
