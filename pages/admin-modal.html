<div
    id="adminModal"
    class="admin-modal"
    aria-hidden="true"
>
    <div
        class="admin-modal-backdrop"
        data-admin-modal-close
    ></div>

    <div
        class="admin-modal-dialog"
        role="dialog"
        aria-modal="true"
    >

        <div class="admin-modal-header">

            <h2 id="adminModalTitle">
                Administração
            </h2>

            <button
                type="button"
                class="admin-modal-close"
                data-admin-modal-close
                aria-label="Fechar"
            >
                ×
            </button>

        </div>

        <div
            id="adminModalContent"
            class="admin-modal-content"
        ></div>

    </div>
</div>
