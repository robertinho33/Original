services:

  aurea:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      AUREA_ADMIN_TOKEN: ${AUREA_ADMIN_TOKEN}

    volumes:
      - aurea-data:/app/server/data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "server/observability/healthcheck.js"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aurea-data:
